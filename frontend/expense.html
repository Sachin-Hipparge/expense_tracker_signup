<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Expense Tracker</title>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

</head>

<body>

    <h1>Daily Expense Tracker</h1>


    <h2>Add Expense</h2>


    <form id="expenseForm">

        <label>
            Money Spent:
        </label>

        <input
            type="number"
            id="amount"
            required
        >

        <br><br>


        <label>
            Description:
        </label>

        <input
            type="text"
            id="description"
            required
        >

        <br><br>







        <button type="submit">
            Add Expense
        </button>

    </form>

    <button id="premiumButton">
    Buy Premium Membership
</button>

<p id="paymentMessage"></p>
<p id="premiumMessage"></p>

<button id="leaderboardButton" style="display: none;">
    Show Leaderboard
</button>

<div id="leaderboard"></div>

    <hr>


    <p id="message"></p>




    <h2>My Expenses</h2>


    <table border="1">

        <thead>

            <tr>

                <th>ID</th>

                <th>Amount</th>

                <th>Description</th>

                <th>Category</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="expenseList">

        </tbody>

    </table>


    <br>

    <hr>

<h2>Expense Reports</h2>

<button id="dailyReportButton">
    Daily
</button>

<button id="weeklyReportButton">
    Weekly
</button>

<button id="monthlyReportButton">
    Monthly
</button>

<button id="downloadReportButton" disabled>
    Download Report
</button>

<div id="report"></div>


    <button id="logoutButton">
        Logout
    </button>


    <script src="expense.js"></script>

</body>

</html>
