<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2>Signup</h2>


    <form id="signupForm">

        <label>
            Enter your name:
        </label>

        <input
            type="text"
            id="name"
            required
        >

        <br><br>


        <label>
            Enter your email:
        </label>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>


        <label>
            Enter your password:
        </label>

        <input
            type="password"
            id="password"
            required
        >

        <br><br>


        <button type="submit">
            Signup
        </button>

    </form>


    <br>

    <a href="login.html">
        Existing User - Login
    </a>


    <p id="message"></p>


    <script src="signup.js"></script>

</body>

</html>
