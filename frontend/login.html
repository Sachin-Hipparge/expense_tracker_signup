<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

</head>

<body>

    <h2>Login</h2>


    <form id="loginForm">

        <label>
            Enter your email:
        </label>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>


        <label>
            Enter your password:
        </label>

        <input
            type="password"
            id="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <br>

    <br><br>

<button type="button" id="forgotPasswordBtn">
    Forgot Password?
</button>

<div id="forgotPasswordForm" style="display: none;">

    <br>

    <input
        type="email"
        id="forgotEmail"
        placeholder="Enter your email"
        required
    >

    <button type="button" id="sendResetEmailBtn">
        Send Reset Email
    </button>

</div>

<p id="forgotMessage"></p>


    <a href="signup.html">
        New User - Signup
    </a>


    <p id="message"></p>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="login.js"></script>

</body>

</html>
