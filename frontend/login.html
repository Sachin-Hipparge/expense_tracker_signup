<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

</head>

<body>

    <h2>Login</h2>


    <form id="loginForm">

        <label>
            Enter your email:
        </label>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>


        <label>
            Enter your password:
        </label>

        <input
            type="password"
            id="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <br>


    <a href="signup.html">
        New User - Signup
    </a>


    <p id="message"></p>


    <script src="login.js"></script>

</body>

</html>
