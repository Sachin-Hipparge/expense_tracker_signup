<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

</head>

<body>

    <h2>Reset Password</h2>

    <form id="resetPasswordForm">

        <label>
            New Password
        </label>

        <br>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
        >

        <br><br>

        <label>
            Confirm Password
        </label>

        <br>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <br><br>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p id="message"></p>

    <script src="reset-password.js"></script>

</body>

</html>
